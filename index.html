<html lang="ko">

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#f7f4ee" />
    <meta name="google-adsense-account" content="ca-pub-2880548693782122" />
    <meta name="description" content="제외 번호와 게임 수를 설정하고 나만의 행운 번호를 뽑아보세요." />
    <title>행운연구소 — 로또 번호 추첨기</title>
    <script>
      (() => {
        const saved = localStorage.getItem('lucky-lab-theme')
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141613' : '#f7f4ee'
      })()
    </script>

  </body>
